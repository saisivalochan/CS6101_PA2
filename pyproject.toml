[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cs6101-pa2"
version = "1.0.0"
description = "Reproducible in-memory Vamana and FAISS experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "faiss-cpu>=1.8,<2", "scikit-learn>=1.4,<2", "datasets>=2.19,<5", "pyarrow>=15", "matplotlib>=3.8,<4", "psutil>=5.9", "reportlab>=4,<5", "threadpoolctl>=3"]

[tool.setuptools]
packages = ["pa2"]
